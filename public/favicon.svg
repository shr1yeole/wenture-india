    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(135)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(150)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(165)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(180)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(195)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(210)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(225)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(240)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(255)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(270)" />
