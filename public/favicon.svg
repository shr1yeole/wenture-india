    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(15)" />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#0B1E40" stroke-width="1.4" stroke-linecap="round" transform="rotate(30)" />
